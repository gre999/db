# Week 13 (phase 5, week 3 / wrap-up week): stage 5 close-out + start of the
# final-report spine tying all five phases together. Written and reviewed
# BEFORE running any new check or generating results_summary.json/
# final_outline.md, per this project's standing discipline. No model is
# retrained here and nothing already finalized (CNN architecture/training,
# week 8-12 success criteria, interpretation rules) is changed - every item
# below is either a new descriptive/diagnostic computation, or a mechanical
# re-aggregation of numbers already produced by earlier weeks' saved
# prediction/backtest files.

# =====================================================================
# Part 0: phase -> week mapping used throughout this file and in
# reports/results_summary.json / reports/final_outline.md.
# FLAG FOR REVIEW: weeks 1-7 were never explicitly labeled "phase N" in
# their own report titles (only weeks 8-12 say "階段四"/"階段五" in the
# title). This mapping is my best reconstruction from thematic breaks and
# config-file naming; please correct if it's wrong before anything downstream
# depends on it.
# =====================================================================
[phases]
phase1 = { weeks = [1, 2], name = "資料品質與特徵工程", role = "infra - no dedicated thesis-support paragraph in final_outline.md (per user spec, only phase 2-5 get one)" }
phase2 = { weeks = [3, 4, 5], name = "波動率預測與部位管理", role = "HAR/隨機森林/XGBoost 波動預測 -> 波動目標部位規模" }
phase3 = { weeks = [6, 7], name = "市場狀態標籤", role = "HMM/KMeans 狀態標籤、ORB/VWAP 在各狀態下的績效" }
phase4 = { weeks = [8, 9, 10], name = "交易日篩選", role = "開盤特徵 logistic/樹模型篩選 ORB 交易日" }
