# =====================================================================
# Part 1: stage 5 close-out (reports/stage5_chapter.md)
# =====================================================================

[stage5.auc_power_analysis]
# New src function `src.dl_eval.auc_power_analysis`, mirroring
# `src.filter_eval.power_analysis` (week 10) exactly: SE = std of the
# block-bootstrap AUC-diff distribution (needs `block_bootstrap_auc_diff`
# to optionally return its raw diffs - a `_dist` variant added alongside it,
# same split as backtest.py's block_bootstrap_sharpe_diff/_dist pair).
# MDE = (z_(1-alpha/2) + z_power) * SE, two-sided.
targets = [
  "task_a_primary: CNN vs hand-feature logistic (week12 primary comparison)",
  "task_a_stacking: stacking vs hand-feature logistic (week12 secondary comparison)",
  "task_b15: CNN vs best flattened baseline",
  "task_b30: CNN vs best flattened baseline",
]
block_size = 20               # trading days, same as every other block bootstrap this project
n_boot = 5000                 # bumped from week12's 2000: this is now estimating an SE for a
                              # power calc, not just a p-value, and week 10's lesson was that
                              # SE/percentile estimates need more precision than a plain
                              # significance call - 5000 keeps runtime reasonable (4 targets)
                              # while roughly halving Monte Carlo noise on the SE vs n_boot=2000
seed = 0
alpha = 0.05
power = 0.80
target_auc_diff = 0.05        # for the "years needed" back-calculation - an AUC diff of 0.05
                              # is the rough scale of what week12 actually observed (0.055,
                              # 0.019), not an arbitrary round number

[stage5.shuffled_label_full]
# Expands week 11/12's single-fold shuffled-label sanity check to all 8
# folds. This reuses the SAME fold fit/val/test splits and the SAME frozen
# single-seed `train_one_seed` + `shuffled_label_check` already in
# src/models/cnn.py - re-derives the deterministic fold splits (WalkForwardSplit,
# validation_years=1) exactly as run_week12_cnn_walkforward.py does, then
# fits 40 shuffled-label models (a diagnostic, not the primary model - the
# primary CNN result from week 12 is not touched). Task A only (task B's
# shuffled-label check was never part of the pre-registered sanity checks).
folds = [1, 2, 3, 4, 5, 6, 7, 8]
shuffle_seeds = [0, 1, 2, 3, 4]  # same 5 seeds already used for the week12 fold-8 reseed
pass_band = [0.45, 0.55]         # unchanged from week11/12's rule - informational only now,
                                 # since a handful of the 40 individual runs literally falling
                                 # outside the band is expected under normal sampling noise
                                 # once you run this many; report the FULL distribution
                                 # (mean, sd, min, max, share outside band) rather than a
                                 # per-run pass/fail count as the headline number

[stage5.fold2_description]
# Fold 2's test window is 2019's data through test_start + 1yr per the walk-
# forward split - CONFIRM EXACT DATES from week12_task_a_fold_diagnostics.parquet
# before writing (expected ~2020 calendar year, i.e. the COVID crash/recovery,
# based on fold 1 = 2019 and the walk-forward's 1-year step - this needs
# verifying against the actual fold boundaries, not assumed from memory).
describe_only = true          # explicitly: no re-weighting, no exclusion, no change to any
                              # already-reported pooled/per-fold number because of this
stats = [
  "annualized realized volatility of QQQ in the test window (vs the other 7 folds' test windows, for scale)",
  "max drawdown of buy-and-hold QQQ in the test window",
  "count of |daily return| > 3% days in the test window",
  "mean VIX level in the test window (vs other folds)",
]
contrast = "CNN test AUC (0.4483, below chance) vs hand-feature logistic's fold-2 test AUC, side by side"

[stage5.task_b_conclusion]
# Purely descriptive synthesis of already-computed week11+week12 numbers
# (no new computation): task B's N=15/30 CNN and baseline AUCs all sit at
# or near 0.50-0.52, block-bootstrap diffs vs the best flattened baseline
# are not significant even before Holm correction, and the directional
# strategy layer (enter in predicted direction, flatten at close) has near-
# zero Sharpe both N. Conclusion to state plainly: the first N minutes of a
# session do not carry usable information about the direction of the
# remainder of that session, at either N tested.

[stage5.future_work_lstm]
# Descriptive only, no computation. Rationale to write: (1) week 12 found the
# CNN carries no incremental information over 14 hand-crafted open-window
# features and is significantly worse standalone (task A); (2) task B's
# flattened-baseline and CNN AUCs are both near chance, so there's no
# established base signal for a longer-memory architecture to extract more
# of; (3) sample size (8 walk-forward folds, ~250 fit-window days each) is
# already tight for a 1809-parameter CNN's overfitting gap - an LSTM/
# Transformer with more parameters and longer effective sequence memory
# would need MORE data to fit responsibly, not less, and this project's
# data history is fixed. Listed as future work conditional on a
# meaningfully longer minute-bar history becoming available, not as a next
# step to take now.

# =====================================================================
# Part 2: reports/results_summary.json (scripts/collect_results.py)
# =====================================================================

[results_summary]
# One row per phase (2-5; phase 1 has no predictive/strategy claim so it's
# excluded from this table, consistent with it having no thesis-support
# paragraph either). Each row has a headline_model (the phase's own
# pre-registered PRIMARY model/comparison - not cherry-picked after the
# fact) with prediction_layer {metric, value, diff, p_value} and
# strategy_layer {sharpe, max_drawdown, diff, p_value, mde}. mde is newly
# computed here for every phase via the SAME block-bootstrap-SE method as
# stage5.auc_power_analysis (§1), applied to Sharpe instead of AUC (reusing
# src.filter_eval.power_analysis's formula/z-factor, generalized to accept
# an arbitrary return-series pair instead of assuming the week8 filter
# pipeline) - this is genuinely new for phases 2/3 (weeks 5-7 never
# computed an MDE; that concept only entered the project in week 10), but
# it is a mechanical recomputation from already-saved return series, not a
# new model or a new backtest design.
# phase2: primary row HAR+殘差XGB vs HAR; secondary row HAR+殘差XGB vs 20日歷史波動
# (week05_position.md 第六節,sharpe diff -0.0161, p=0.8517) - both already
# block-bootstrap-tested in week 5, reused here not rerun.
headline_model.phase2 = [
  { row = "primary", label = "HAR+殘差XGB vs HAR", prediction_layer_metric = "QLIKE (pooled OOS)" },
  { row = "secondary", label = "HAR+殘差XGB vs 20日歷史波動", prediction_layer_metric = "QLIKE (pooled OOS)" },
]
# phase3: two rows, HMM-filtered ORB and HMM-filtered VWAP, both on the
# common date range 2020-01-02..2026-09-22 (1689 days, week07_regime_eval.md
# 第254行既有的共同覆蓋範圍). prediction_layer is NOT kappa here - it's the
# model-external validation already in week07_regime_eval.md (第44-51行):
# predictive-type HMM state vs actual realized volatility (log_rv_desc),
# Newey-West HAC t-test, state0 as reference. HMM state1 diff=0.7254
# t=9.9349 p~0, state2 diff=1.3906 t=12.1974 p~0 - reused directly from
# that table (recomputation only needs to reload the saved state labels +
# realized-vol series, not refit HMM).
headline_model.phase3 = [
  { row = "orb", label = "HMM 狀態篩選 ORB vs 不篩選", date_range = "2020-01-02..2026-09-22 (1689 天)", prediction_layer_metric = "模型外驗證:預測型HMM狀態分組的已實現波動差異與t值 (Newey-West HAC, state0為對照組)" },
  { row = "vwap", label = "HMM 狀態篩選 VWAP vs 不篩選", date_range = "2020-01-02..2026-09-22 (1689 天)", prediction_layer_metric = "同上,與ORB列共用同一組狀態分組t值(狀態分組不隨策略變)" },
]
headline_model.phase4 = "logistic 篩選 ORB vs 不篩選 (week08/09/10 貫穿全程的主模型,不是探索性兩特徵模型); prediction_layer metric = AUC (pooled OOS)"
headline_model.phase5 = "CNN vs 手工特徵 logistic (task A 主比較,week12); prediction_layer metric = AUC (pooled, 2019-2026 共同日期)"
cross_check = "every number in results_summary.json is cross-checked by hand against the exact figure already printed in that week's own report; any mismatch is listed and investigated (not silently reconciled) in reports/stage5_chapter.md or a short note in results_summary.json itself, per the completion standard"
mde_phase2_phase3_note = "階段二、三的策略層MDE是事後補算(這個概念第10週才引入,週5-7沒算過),僅供判讀當年樣本量的檢定力量級,不改變該階段原本報告的結論或成功/失敗判定"

