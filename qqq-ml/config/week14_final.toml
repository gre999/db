# Week 14 (final week): robustness matrix, final report, reproducibility,
# defense prep. Written and reviewed BEFORE filling any gap, per this
# project's standing discipline. No new research question, no changed
# conclusion - every gap filled here is a robustness check applied to an
# already-frozen model/rule, using already-established parameters
# (cost assumptions, ORB's own target_r, random-null methodology) that
# earlier weeks already used elsewhere in the project. Any result that
# conflicts with an earlier week's conclusion is written into the
# correction log honestly, not smoothed over.

